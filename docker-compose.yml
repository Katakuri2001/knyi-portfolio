# A single-node deployment of the portfolio and its console.
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d
#
# The `knyi-data` volume holds the analytics and leads database. It must
# persist, or the history is lost on the next `up -d`.

services:
  web:
    build: .
    image: knyi-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - knyi-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  knyi-data:
